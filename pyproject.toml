[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tasklite"
version = "0.1.1"
description = "Lightweight local task queue and scheduler backed by SQLite"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff"
]

[project.scripts]
tasklite = "tasklite.cli:main"
